[project]
name = "artemis-mudri"
version = "0.1.0"
description = "面向教学的 MuJoCo 自动行驶小车演示"
authors = [
    {name = "migo",email = "1695587905@qq.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy (<2.3)",
    "tqdm (>=4.67.3,<5.0.0)",
    "mujoco (>=3.7.0,<4.0.0)",
    "scipy (<1.17)",
    "typer (>=0.24.1,<0.25.0)",
    "gymnasium[mujoco] (>=1.3.0,<2.0.0)",
    "omegaconf (>=2.3.0,<3.0.0)",
    "pyzmq (>=27.0.0,<28.0.0)",
]

[project.scripts]
artemis-demo = "artemis_mudri.commands.app:app"

[tool.poetry]
packages = [{include = "artemis_mudri", from = "src"}]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
